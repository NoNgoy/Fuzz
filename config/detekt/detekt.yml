# Поверх стандартной конфигурации detekt. Форматирование проверяет ktlint через Spotless.
config:
  validation: true

complexity:
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 10
    ignoreDefaultParameters: true
    ignoreAnnotatedParameter: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    ignoreAnnotatedFunctions: ['Preview']
    thresholdInFiles: 20
    thresholdInClasses: 20
    thresholdInInterfaces: 20

naming:
  # Файлы навигации фич держат маршрут и расширение NavGraphBuilder вместе.
  MatchingDeclarationName:
    excludes: ['**/*Navigation.kt']
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

style:
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotated: ['Composable', 'Preview']
    excludes: ['**/test/**', '**/design/**']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  ReturnCount:
    max: 3
  ForbiddenComment:
    active: false
