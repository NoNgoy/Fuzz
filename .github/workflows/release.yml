name: Release

# Выпуск APK: тег vX.Y.Z или ручной запуск во вкладке Actions.
# APK прикладывается к GitHub Release с тем же именем, откуда его можно скачать на телефон.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Версия без «v», например 0.1.0
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"

      # Берём кэш Gradle от задачи check из CI: там уже лежит дистрибутив Gradle. Скачивание
      # с services.gradle.org (через релизы GitHub) бывает недоступно часами, и релиз падал на старте.
      - uses: gradle/actions/setup-gradle@v4
        env:
          GRADLE_BUILD_ACTION_CACHE_KEY_JOB: check
        with:
          cache-read-only: true

      - name: Ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.FUZZ_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fuzz-release.jks"
            echo "FUZZ_KEYSTORE_PATH=$RUNNER_TEMP/fuzz-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Секрет FUZZ_KEYSTORE_BASE64 не задан, APK подписан отладочным ключом"
          fi

      - name: Сборка APK
        env:
          FUZZ_KEYSTORE_PASSWORD: ${{ secrets.FUZZ_KEYSTORE_PASSWORD }}
          FUZZ_KEY_ALIAS: ${{ secrets.FUZZ_KEY_ALIAS }}
          FUZZ_KEY_PASSWORD: ${{ secrets.FUZZ_KEY_PASSWORD }}
          FUZZ_LASTFM_API_KEY: ${{ secrets.FUZZ_LASTFM_API_KEY }}
          FUZZ_JAMENDO_CLIENT_ID: ${{ secrets.FUZZ_JAMENDO_CLIENT_ID }}
          FUZZ_VERSION_CODE: ${{ github.run_number }}
        run: |
          export FUZZ_VERSION_NAME="${VERSION#v}"
          ./gradlew :app:assembleRelease --max-workers=2
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Fuzz-${FUZZ_VERSION_NAME}.apk"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION#v}"
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Fuzz ${TAG#v}" --generate-notes
          fi
          gh release upload "$TAG" out/*.apk --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk
          retention-days: 30
