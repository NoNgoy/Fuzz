syntax = "proto3";

package dev.fuzz.core.datastore;

option java_package = "dev.fuzz.core.datastore";
option java_multiple_files = true;

message MusicFolderProto {
  string id = 1;
  string label = 2;
}

message UserPreferences {
  bool onboarding_completed = 1;
  repeated MusicFolderProto music_folders = 2;
  // Пользователь хотя бы раз сохранял выбор папок: пустой список тогда значит «ничего», а не «по умолчанию».
  bool folders_chosen = 3;
  // Нет поля — настройки волны по умолчанию.
  optional WaveSettingsProto wave = 4;
  repeated ConnectionProto connections = 5;
}

// Настройки волны. Пустая строка в enum-полях значит «не выбрано».
message WaveSettingsProto {
  int32 familiarity = 1;
  string activity = 2;
  string mood = 3;
  string character = 4;
}

// Своё подключение (раздел 8.4 ТЗ). Секрет зашифрован ключом из Android Keystore: IV + шифротекст AES-GCM.
message ConnectionProto {
  string id = 1;
  string kind = 2;
  string name = 3;
  string base_url = 4;
  string username = 5;
  string manifest = 6;
  bool enabled = 7;
  bytes secret = 8;
  // Код JS-плагина; описание лежит в manifest.
  string script = 9;
}
