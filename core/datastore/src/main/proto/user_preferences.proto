syntax = "proto3";

package dev.fuzz.core.datastore;

option java_package = "dev.fuzz.core.datastore";
option java_multiple_files = true;

message MusicFolderProto {
  string id = 1;
  string label = 2;
}

message UserPreferences {
  bool onboarding_completed = 1;
  repeated MusicFolderProto music_folders = 2;
  // Пользователь хотя бы раз сохранял выбор папок: пустой список тогда значит «ничего», а не «по умолчанию».
  bool folders_chosen = 3;
  // Нет поля — настройки волны по умолчанию.
  optional WaveSettingsProto wave = 4;
  repeated ConnectionProto connections = 5;
  // Нет поля — звук по умолчанию: эквалайзер выключен.
  optional SoundProto sound = 6;
  // Пустая строка — значение по умолчанию: тема как в системе, цвет Fuzz.
  string theme = 7;
  string accent = 8;
  // Нет поля — всё по умолчанию (см. AppSettings).
  optional AppSettingsProto app = 9;
}

// Сканер, наушники, кэш, качество и жесты. Пустые и отсутствующие поля — значения по умолчанию.
message AppSettingsProto {
  optional bool skip_voice_notes = 1;
  optional int32 min_duration_sec = 2;
  optional bool pause_on_disconnect = 3;
  optional int32 cache_limit_mb = 4;
  string wifi_quality = 5;
  string mobile_quality = 6;
  optional bool artwork_gestures = 7;
}

// Эквалайзер и переходы. Пустой preset — ручная настройка полос.
message SoundProto {
  bool equalizer_enabled = 1;
  string preset = 2;
  repeated float custom_gains_db = 3;
  float bass_boost = 4;
  int32 fade_seconds = 5;
  bool skip_silence = 6;
  bool normalize = 7;
}

// Настройки волны. Пустая строка в enum-полях значит «не выбрано».
message WaveSettingsProto {
  int32 familiarity = 1;
  string activity = 2;
  string mood = 3;
  string character = 4;
}

// Своё подключение (раздел 8.4 ТЗ). Секрет зашифрован ключом из Android Keystore: IV + шифротекст AES-GCM.
message ConnectionProto {
  string id = 1;
  string kind = 2;
  string name = 3;
  string base_url = 4;
  string username = 5;
  string manifest = 6;
  bool enabled = 7;
  bytes secret = 8;
  // Код JS-плагина; описание лежит в manifest.
  string script = 9;
}
